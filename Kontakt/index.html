<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
</head>

<body>
    <header>
            <nav>
                <a href="../index.html">Strona główna</a>
                <a href="../Linki/index.html">Linki</a>
            </nav>
    </header>
    
    <main>
        <section>
            <h1>Kontakt</h1>
        </section>

        <section>
            <h2>Formularz kontaktowy</h2>

            <form action="#">
                <fieldset>
                <div>
                    <label for="firstName">Imię:</label>
                    <input id="firstName" name="firstName" type="text">
                </div>
                    
                <div>
                    <label for="lastName">Nazwisko:</label>
                    <input id="lastName" name="lastName" type="text">
                </div>

                <div>
                    <label for="phoneNumber">Numer telefonu:</label>
                    <input id="phoneNumber" name="phoneNumber" type="number">
                </div>

                <div>
                    <label for="subject">Temat:</label>
                    <select name="subject" id="subject">
                        <option value="questions">Pytania</option>
                        <option value="feedback">Uwagi</option>
                        <option value="complaints">Reklamacje</option>
                    </select>
                </div>

                <div>
                    <label for="message">Treść wiadomości:</label>
                    <textarea name="message" id="message" rows="7" cols="50"></textarea>
                </div>
                </fieldset>

                <fieldset>
                <div>
                    <input name="terms" id="terms" type="checkbox" >
                    <label for="terms">
                        Wyrażam zgodę na przetwarzanie moich danych.
                </div>
                </fieldset>

                <div>
                    <input value="Wyślij" type="submit">
                </div>
            </form>
        </section>
    </main>

    <footer>
        Stopka
    </footer>
    
</body>
</html>
